function render(){let html='';if(state.locked){screen.innerHTML=state.passcodeOpen?passcodeView():lockView();$('#homeIndicator').style.background='#fff';$('#statusTime').textContent='1:02';return}switch(state.page){case'home':html=homeView();break;case'kakao':html=kakaoView();break;case'chat':html=chatView();break;case'incoming':html=incomingView();break;case'nightCall':html=nightCallView();break;case'morningIncoming':html=morningIncomingView();break;case'morningCall':html=morningCallView();break;case'calls':html=callsView();break;case'notes':html=notesView();break;case'google':html=googleView();break;case'googleSearch':html=googleSearchView();break;case'photos':html=simpleView('사진',`<div class="photo-grid">${['🌆','☕','🐈','🌙','🍜','🎧','🌊','🌃','🧸'].map(x=>`<div class="photo-tile">${x}</div>`).join('')}</div>`) ;break;case'calendar':html=simpleView('캘린더','<div class="card"><h2>10월 25일 일요일</h2><p>오전 7:00 · 데이트 준비</p></div>');break;case'music':html=simpleView('음악','<div class="card"><h3>Late night playlist</h3><p>🎵 밤에 듣기 좋은 노래</p></div>');break;case'settings':html=simpleView('설정','<div class="card">내 iPhone · 개인용</div>');break;default:html=homeView()}screen.innerHTML=html;$('#statusTime').textContent=state.daytime?'7:03':state.page==='morningIncoming'||state.page==='morningCall'?'7:03':'1:02';$('#homeIndicator').style.background='#fff';if(state.page==='chat'){let box=$('#chatMessages');if(box)box.scrollTop=box.scrollHeight}if(state.lastSearch&&state.page==='googleSearch'){let el=$('#googleInput');if(el)el.value=state.lastSearch}}
$('#homeIndicator').addEventListener('click',()=>{if(state.locked){state.passcodeOpen=true;state.passcode='';render()}else if(['incoming','nightCall','morningIncoming','morningCall'].includes(state.page)){/* call UI stays */}else setPage('home')});
const originalSetPage=setPage;setPage=function(p){state.page=p;render()};
// After either night branch, show the next-morning call when returning to the phone/home.
const _finishNightCall=finishNightCall;finishNightCall=function(){state.page='home';state.nightFinished=true;state.morningReady=true;state.daytime=true;render();setTimeout(()=>{if(state.page==='home')setPage('morningIncoming')},700)};
const _finishMorning=finishMorning;finishMorning=function(){state.page='home';state.daytime=true;render()};
render();

</script>
