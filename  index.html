function render(){let html='';if(state.locked){screen.innerHTML=state.passcodeOpen?passcodeView():lockView();$('#homeIndicator').style.background='#fff';$('#statusTime').textContent='1:02';return}switch(state.page){case'transition':html='<div class="transition-screen"><strong>몇 시간 후…</strong><span>다음 날 아침 · 오전 7:03</span><div style="font-size:32px;margin-top:12px">🌤️</div><button class="next-line" onclick="setPage(\'calls\')">전화 앱 열기</button><button class="back" onclick="state.daytime=true;setPage(\'morningIncoming\')">아침으로 넘어가기</button></div>';break;case'home':html=homeView();break;case'kakao':html=kakaoView();break;case'chat':html=chatView();break;case'friendChat':html=friendChatView();break;case'incoming':html=incomingView();break;case'nightCall':html=nightCallView();break;case'morningIncoming':html=morningIncomingView();break;case'morningCall':html=morningCallView();break;case'extraCall':html=extraCallView();break;case'calls':html=callsView();break;case'notes':html=notesView();break;case'google':html=googleView();break;case'googleSearch':html=googleSearchView();break;case'photos':html=simpleView('사진',`<div class="photo-grid">${['🌆','☕','🐈','🌙','🍜','🎧','🌊','🌃','🧸'].map(x=>`<div class="photo-tile">${x}</div>`).join('')}</div>`) ;break;case'calendar':html=simpleView('캘린더','<div class="card"><h2>10월 25일 일요일</h2><p>오전 7:00 · 데이트 준비</p></div>');break;case'music':html=simpleView('음악','<div class="card"><h3>Late night playlist</h3><p>🎵 밤에 듣기 좋은 노래</p></div>');break;case'settings':html=simpleView('설정','<div class="card">내 iPhone · 개인용</div>');break;default:html=homeView()}screen.innerHTML=html;$('#statusTime').textContent=state.daytime?'7:03':state.page==='morningIncoming'||state.page==='morningCall'?'7:03':'1:02';$('#homeIndicator').style.background='#fff';if(state.page==='chat'){let box=$('#chatMessages');if(box)box.scrollTop=box.scrollHeight}if(state.lastSearch&&state.page==='googleSearch'){let el=$('#googleInput');if(el)el.value=state.lastSearch}if(state.language==='ja')translateUI()}
function translateUI(){const pairs={'카카오톡':'カカオトーク','전화':'電話','메모':'メモ','사진':'写真','캘린더':'カレンダー','음악':'音楽','설정':'設定','친구':'友だち','채팅':'トーク','오픈채팅':'オープンチャット','검색':'検索','최근 통화':'最近の通話','즐겨찾기':'お気に入り','메시지 입력':'メッセージを入力','온라인':'オンライン','지난 대화':'過去の会話','모든 메모':'すべてのメモ','암호 입력':'パスコードを入力','내 iPhone':'自分のiPhone','취소':'キャンセル','지우기':'削除','다음':'次へ','말하기':'話す','받기':'応答','거절':'拒否','수신 중':'着信中','통화 중':'通話中','다음 날':'翌朝','아침으로 넘어가기':'翌朝へ進む','전화 앱 열기':'電話アプリを開く','오늘도 천천히, 괜찮아 ☁️':'今日もゆっくり、大丈夫 ☁️','오늘의 메모':'今日のメモ','잊지 말기 ✨':'忘れないで ✨','오늘은 조금 더 행복하기.':'今日は少しだけ幸せに。','최근 검색':'最近の検索','검색어 입력':'検索ワードを入力','카카오톡 음성 통화':'カカオトーク音声通話','오전 7:03 · 카카오톡 음성 통화':'午前7:03 · カカオトーク音声通話'};document.querySelectorAll('button,span,strong,p,div,h2,input').forEach(el=>{if(el.children.length===0){if(el.tagName==='INPUT'&&el.placeholder){if(pairs[el.placeholder])el.placeholder=pairs[el.placeholder]}else{let t=el.textContent.trim();if(pairs[t])el.textContent=pairs[t]}}});}
$('#homeIndicator').addEventListener('click',()=>{if(state.locked){state.passcodeOpen=true;state.passcode='';render()}else if(['incoming','nightCall','morningIncoming','morningCall'].includes(state.page)){/* call UI stays */}else setPage('home')});
const originalSetPage=setPage;setPage=function(p){state.page=p;render()};
// After either night branch, show the next-morning call when returning to the phone/home.
const _finishNightCall=finishNightCall;finishNightCall=function(){state.page='home';state.nightFinished=true;state.morningReady=true;state.daytime=true;render();setTimeout(()=>{if(state.page==='home')setPage('morningIncoming')},700)};
const _finishMorning=finishMorning;finishMorning=function(){state.page='home';state.daytime=true;render()};
render();

</script>
